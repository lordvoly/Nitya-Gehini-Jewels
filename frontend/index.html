<!doctype html>
<html lang="en">
  <head>
    <!-- rebuild trigger: Checkpoint (a) preview VITE_API_URL verification -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitya Gehini Jewels</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS standalone reads this (not theme-color) for the status bar;
         "black-translucent" lets the dark app show through it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Placeholder value; the inline script below overwrites it with the
         resolved theme's colour before first paint, and theme.ts keeps it
         in step on an in-app light/dark toggle. An installed Android PWA
         also reads manifest.webmanifest's theme_color (baked at install,
         refreshed lazily by Chrome). -->
    <meta name="theme-color" content="#7a1e32" />
    <!-- Runs before first paint: sets data-theme so the correct theme
         renders immediately (no flash while main.tsx loads), and points
         <meta name="theme-color"> at that theme's chrome colour so the
         browser/OS status bar matches from the very first frame. "system"
         (no stored value) falls back to the OS prefers-color-scheme. -->
    <script>
      (function () {
        var v = localStorage.getItem("ngj-theme");
        if (v === "light" || v === "dark") document.documentElement.setAttribute("data-theme", v);
        var dark =
          v === "dark" ||
          (v !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0d0d0f" : "#7a1e32");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
